services:
- type: web
  name: nomad-ai-backend
  env: python
  plan: free
  buildCommand: pip install -r backend/requirements.txt
  startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
  rootDir: backend
  autoDeploy: true
  envVars:
  - key: DATABASE_URL
    value: sqlite:///./nomad_ai.db
  - key: CORS_ORIGINS
    value: "*"